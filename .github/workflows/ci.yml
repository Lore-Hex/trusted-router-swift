name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "*"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Static gate
        run: swiftlint --strict
      - name: Static gate mutation proof
        run: python3 scripts/static-gate-check.py
      - name: Test
        run: swift test
      - name: Boundary mutation gate
        run: scripts/mutation-check.sh

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
